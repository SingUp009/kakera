[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
image = "0.25"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
rayon = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"